<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <title>tamagotchiiii</title>
</head>

<body>
    <header id="hero">
        <span class="paws">&#128035;</span>
        <h1>tamagotchiiii</h1>
    </header>
    <main>
        <div class="data-container">
            <section id="pet-properties">
                <h2>Custom design your pet:</h2>
                <form>
                    <label for="pet-name">Choose your own name or leave blank for a random name... </label>
                    <input type="text" id="pet-name" placeholder="write a name or get a random one"><br>
                    <label for="pet-option">Choose a pet:</label>
                    <select id="pet-option">
                        <option value="dog" selected>dog</option>
                        <option value="ginuepig">ginuepig</option>
                        <option value="cat">cat</option>
                        <option value="jaguar">jaguar</option>
                    </select><br>
                    <button id="pet-btn">Create Pet</button>
                </form>
            </section>
            <section id="pet-activities">
                <h3>This is what you have done with ure pets so far:</h3><br>
                <p id="no-activities">Nothing... go play with them!</p>
                <!--Activity log-->
            </section>
        </div>
        <section id="pet-container">
            <h3>All your pets that wants to play....</h3>
            <small>Take care of your pet or pets so that they dont die. Make sure you feed and play with them to keep
                them
                happy!</small>
            <div id="pet-cards">
                <!--Cards with max 4 pets-->
            </div>
        </section>
    </main>
</body>

</html>
